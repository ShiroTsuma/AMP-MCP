name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            python: python
            archive: amp-mcp-windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            python: python3
            archive: amp-mcp-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = & gofmt -l @files
          if ($LASTEXITCODE -ne 0 -or $unformatted) { throw "Run gofmt on: $unformatted" }
      - name: Vet
        run: go vet ./...
      - name: Test critical contracts
        run: go test ./...
      - name: Build public archive
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version v0.0.0-ci -Platform ${{ matrix.platform }}
      - name: Verify packaged server
        run: ${{ matrix.python }} scripts/check_release.py --version v0.0.0-ci --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amp-mcp-${{ matrix.platform }}-x64
          path: |
            dist/${{ matrix.archive }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
