name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            python: python
            archive: amp-mcp-windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            python: python3
            archive: amp-mcp-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = & gofmt -l @files
          if ($LASTEXITCODE -ne 0 -or $unformatted) { throw "Run gofmt on: $unformatted" }
      - name: Vet
        run: go vet ./...
      - name: Test critical contracts
        run: go test ./...
      - name: Build and verify public archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -Platform ${{ matrix.platform }}
          ${{ matrix.python }} scripts/check_release.py --version $env:RELEASE_VERSION --platform ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        working-directory: dist
        run: |
          $archives = @('amp-mcp-windows-x64.zip', 'amp-mcp-linux-x64.tar.gz')
          $sums = foreach ($a in $archives) { (Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash.ToLowerInvariant() + "  $a" }
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS'), (($sums | Sort-Object { $_.Substring(66) }) -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $releaseArgs = @('release', 'create', $env:RELEASE_VERSION, '--verify-tag', '--notes-from-tag', '--title', "AMP-MCP $env:RELEASE_VERSION")
          if ($env:RELEASE_VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
          $releaseArgs += @($archives + 'SHA256SUMS')
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect GitHub before retrying.' }
